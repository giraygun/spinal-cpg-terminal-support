name: reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewer-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Install locked reviewer environment
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-reviewer-lock.txt
      - name: Verify frozen artifact
        run: python reviewer_verify.py
      - name: Run release-contract tests
        run: python -B -m unittest -v test_single_realization_v2_6_2.py
      - name: Run focused numerical tests
        run: python -B test_numerics_architecture_v2_6_1.py
      - name: Build the frozen matrix without simulation
        run: |
          python run_single_realization_v2_6_2.py \
            --dry-run \
            --outdir "${RUNNER_TEMP}/reviewer_matrix" \
            --workers 1
      - name: Reproduce the archived analysis without touching frozen outputs
        run: >-
          python reviewer_reproduce_analysis.py
          "${RUNNER_TEMP}/reviewer_reanalysis"
      - name: Rebuild and verify the read-only manuscript analysis
        run: |
          (cd manuscript_analysis_v2_6_2 && sha256sum -c MANIFEST.sha256)
          python manuscript_analysis_v2_6_2/scripts/validate_sources_and_protocol.py
          python manuscript_analysis_v2_6_2/scripts/analyze_a_to_d.py
          python manuscript_analysis_v2_6_2/scripts/analyze_e_f.py
          python manuscript_analysis_v2_6_2/scripts/analyze_g_h.py
          python manuscript_analysis_v2_6_2/scripts/audit_derived_outputs.py
          python manuscript_analysis_v2_6_2/scripts/build_publication_outputs.py
          python manuscript_analysis_v2_6_2/scripts/verify_reference_outputs.py
      - name: Run one-task technical smoke test
        run: |
          python run_ah_experiments_accelerated_v2_6_1.py \
            --stage A \
            --seeds 601 \
            --outdir "${RUNNER_TEMP}/reviewer_numeric_smoke" \
            --workers 1 \
            --smoke \
            --limit 1 \
            --progress-every 1

  container-checks:
    runs-on: ubuntu-24.04
    needs: reviewer-checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build reviewer container from the pinned base image
        run: docker build --tag cpg-v2-6-2-reviewer:ci .
      - name: Verify the packaged artifact inside the container
        run: docker run --rm cpg-v2-6-2-reviewer:ci

  prepare-v2-6-2-draft:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'release: prepare v2.6.2 draft'
    runs-on: ubuntu-24.04
    needs: [reviewer-checks, container-checks]
    concurrency:
      group: release-v2.6.2
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm an unused fixed release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          if git ls-remote --exit-code --tags origin refs/tags/v2.6.2; then
            echo "refs/tags/v2.6.2 already exists; refusing to replace it" >&2
            exit 1
          fi
          if gh release view v2.6.2 >/dev/null 2>&1; then
            echo "GitHub release v2.6.2 already exists; refusing to replace it" >&2
            exit 1
          fi
      - name: Build the curated archive from the reviewed commit
        run: |
          git archive \
            --format=tar.gz \
            --prefix=spinal-cpg-terminal-support-v2.6.2/ \
            --output=spinal-cpg-terminal-support-v2.6.2.tar.gz \
            "${GITHUB_SHA}"
          sha256sum spinal-cpg-terminal-support-v2.6.2.tar.gz \
            > spinal-cpg-terminal-support-v2.6.2.tar.gz.sha256
          cp RELEASE_NOTES_v2_6_2.md "${RUNNER_TEMP}/release-notes.md"
          printf '\n## Release identity\n\n' \
            >> "${RUNNER_TEMP}/release-notes.md"
          printf -- '- Commit: `%s`\n' "${GITHUB_SHA}" \
            >> "${RUNNER_TEMP}/release-notes.md"
          printf -- '- Verification: https://github.com/%s/actions/runs/%s\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" \
            >> "${RUNNER_TEMP}/release-notes.md"
      - name: Create the fixed draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.6.2 \
            spinal-cpg-terminal-support-v2.6.2.tar.gz \
            spinal-cpg-terminal-support-v2.6.2.tar.gz.sha256 \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "v2.6.2 - Frozen single-realization spinal CPG reviewer release" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"

  publish-v2-6-2:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/release-v2-6-2-publication' &&
      github.event.head_commit.message == 'release: publish v2.6.2'
    runs-on: ubuntu-24.04
    needs: [reviewer-checks, container-checks]
    concurrency:
      group: release-v2.6.2
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_ID: "377459522"
      RELEASE_COMMIT: ac47546c60a78748cd9370fbdb00dc5aa01e8ba4
      ARCHIVE_NAME: spinal-cpg-terminal-support-v2.6.2.tar.gz
      ARCHIVE_SIZE: "14644792"
      ARCHIVE_DIGEST: sha256:5f7b88242419dd0d6fb5a8e0157673fea06331ec7b61b70dd0da0f6615bf7b81
      CHECKSUM_NAME: spinal-cpg-terminal-support-v2.6.2.tar.gz.sha256
      CHECKSUM_SIZE: "108"
      CHECKSUM_DIGEST: sha256:459f6e7bc8ef7a146e3ee9922128e4d913fb8c561d130fefd87d9cf2034ff86f
    steps:
      - name: Verify and publish the fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          default_branch="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}" \
              --jq '.default_branch'
          )"
          test "${default_branch}" = "main"
          default_sha="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/${default_branch}" \
              --jq '.object.sha'
          )"
          test "${default_sha}" = "${RELEASE_COMMIT}"

          release_json="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          )"

          jq -e \
            --arg tag "v2.6.2" \
            --arg target "${RELEASE_COMMIT}" \
            '.tag_name == $tag and
             .target_commitish == $target and
             .prerelease == false' \
            <<< "${release_json}" >/dev/null

          verify_asset() {
            local name="$1"
            local size="$2"
            local digest="$3"
            jq -e \
              --arg name "${name}" \
              --argjson size "${size}" \
              --arg digest "${digest}" \
              '[.assets[] |
                select(.name == $name and
                       .size == $size and
                       .digest == $digest and
                       .state == "uploaded")] |
               length == 1' \
              <<< "${release_json}" >/dev/null
          }

          test "$(jq '.assets | length' <<< "${release_json}")" = "2"
          verify_asset \
            "${ARCHIVE_NAME}" "${ARCHIVE_SIZE}" "${ARCHIVE_DIGEST}"
          verify_asset \
            "${CHECKSUM_NAME}" "${CHECKSUM_SIZE}" "${CHECKSUM_DIGEST}"

          if test "$(jq -r '.draft' <<< "${release_json}")" = "true"; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false \
              -f make_latest=true \
              > "${RUNNER_TEMP}/published-release.json"
          fi

          published_json="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          )"
          jq -e \
            --arg tag "v2.6.2" \
            --arg target "${RELEASE_COMMIT}" \
            '.draft == false and
             .prerelease == false and
             .tag_name == $tag and
             .target_commitish == $target and
             .published_at != null' \
            <<< "${published_json}" >/dev/null

          tag_sha="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/v2.6.2" \
              --jq '.object.sha'
          )"
          test "${tag_sha}" = "${RELEASE_COMMIT}"
